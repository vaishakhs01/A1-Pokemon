<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="bg">
      <div class="left-bg"></div>
      <div class="right-bg"></div>
      <div class="container">
        <nav>
          <img width="200px" src="./Pokemon-Logo.png" alt="" />
          <i class="ri-menu-line"></i>
        </nav>
        <main>
          <div class="content">
            <div class="left-section">
              <p class="gen">POKEMON GEN I</p>
              <h1>Pikachu</h1>
              <p class="about">
                Pikachu is an Electric-type Pokémon introduced in Generation I.
                Pikachu are small, chubby, and incredibly cute mouse-like
                Pokémon. They are almost completely covered by yellow fur.
              </p>

              <div class="last">
                <div class="line"></div>
                <p class="rank">01/08</p>
              </div>
            </div>
            <div class="right-section">
              <img width="700px" src="./pika pika.png" alt="pikachu" />
            </div>
            <div class="pokeball">
              <img src="./pokeball.png" alt="pokeball" />
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
